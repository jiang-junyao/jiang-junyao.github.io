<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#06111f">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{% if page.title and page.title != "" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <div class="site-atmosphere" aria-hidden="true"></div>
    {% include nav.html %}
    <main id="main" class="site-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="container footer-grid">
        <p>Junyao Jiang / Computational Biology / Westlake University</p>
        <div class="footer-links">
          <a href="mailto:{{ site.author.email }}">Email</a>
          <a href="{{ site.author.github }}">GitHub</a>
          <a href="{{ site.author.scholar }}">Google Scholar</a>
          <a href="{{ site.author.orcid }}">ORCID</a>
        </div>
      </div>
    </footer>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
