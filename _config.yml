title: "Junyao Jiang"
description: "Computational biologist working on machine learning, single-cell genomics, spatial omics, and cell fate decisions."
url: "https://jiang-junyao.github.io"
baseurl: ""
repository: "jiang-junyao/jiang-junyao.github.io"
timezone: Asia/Shanghai
encoding: "utf-8"

author:
  name: "Junyao Jiang"
  role: "Computational Biologist"
  affiliation: "Westlake University"
  location: "Hangzhou, China"
  email: "jiangjunyao@westlake.edu.cn"
  github: "https://github.com/jiang-junyao"
  scholar: "https://scholar.google.com/citations?user=7mutOvgAAAAJ&hl=en"
  orcid: "https://orcid.org/my-orcid?orcid=0009-0006-8639-059X"

include:
  - _pages

markdown: kramdown
highlighter: rouge
permalink: /:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - preview.html
  - preview-news.html
  - preview-gallery.html
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
